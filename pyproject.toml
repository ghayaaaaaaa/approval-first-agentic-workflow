[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-first-agentic-workflow"
version = "0.2.0"
description = "Approval-first agentic workflow with optional Responses API planning, a strict tool allowlist, and SQLite audit trail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66.0"]

[project.scripts]
approval-agent = "approval_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

